<!-- Conteúdo principal -->
 {% load static %}
 
<main class="container mt-5">
        <h2 class="mb-4">Listagem de Conversas</h2>

        <!-- Tabela de conversas -->
        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Id da pessoa</th>
                        <th>Id do território</th>
                        <th>Data</th>
                    </tr>
                </thead>
                <tbody>
                    {% for conversa in conversas %}
                    <tr>
                        <td>{{ conversa.id }}</td>
                        <td>{{ conversa.pessoa }}</td>
                        <td>{{ conversa.territorio }}</td>
                        <td>{{ conversa.data_conversa }}</td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4" class="text-center">Nenhuma conversa cadastrada.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
</main>
