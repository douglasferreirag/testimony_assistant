{% load static %}

<!-- Conteúdo principal -->
<main class="container mt-5">
        <h2 class="mb-4">Listagem de Folhetos</h2>

        <!-- Tabela de folhetos -->
        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Descrição</th>
                        <th>Ano</th>
                        <th>Tamanho</th>
                        <th>Base</th>
                    </tr>
                </thead>
                <tbody>
                    {% for folheto in folhetos %}
                    <tr>
                        <td>{{ folheto.id }}</td>
                        <td>{{ folheto.descricao }}</td>
                        <td>{{ folheto.ano }}</td>
                        <td>{{ folheto.tamanho }}</td>
                        <td>{{ folheto.base }}</td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="5" class="text-center">Nenhum folheto cadastrado.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
</main>
