<!-- Conteúdo principal -->

{% load static %}

<main class="container mt-5">
        <h2 class="mb-4">Listagem de Estudos</h2>

        <!-- Tabela de estudos -->
        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>ID da Conversa</th>
                        <th>ID da Publicação</th>
                        <th>Onde Continuar</th>
                    </tr>
                </thead>
                <tbody>
                    {% for estudo in estudos %}
                    <tr>
                        <td>{{ estudo.id }}</td>
                        <td>{{ estudo.conversa_id }}</td>
                        <td>{{ estudo.publicacao_id }}</td>
                        <td>{{ estudo.ondecontinuar }}</td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4" class="text-center">Nenhum estudo cadastrado.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
</main>
