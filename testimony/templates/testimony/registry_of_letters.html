{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Carta</title>
    <!-- Bootstrap CSS local -->
    <link rel="stylesheet" href="{% static 'testimony/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'testimony/css/style.css' %}">
    
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Testimony Assistant</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                    data-bs-target="#navbarNav" aria-controls="navbarNav" 
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Itens do menu -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'registry_of_letters' %}">Cadastrar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Limpar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/">Página Inicial</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo principal com grid -->
    <main class="container mt-5">
        <h2 class="mb-4">Cadastro de Carta</h2>
        
        <form>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="id" class="form-label">ID</label>
                    <input type="text" class="form-control" id="id" name="id" placeholder="Digite o ID">
                </div>
                <div class="col-md-6">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite o nome">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="base" class="form-label">Base</label>
                    <input type="text" class="form-control" id="base" name="base" placeholder="Digite a base">
                </div>
            </div>
        </form>
    </main>

    <!-- Rodapé -->
    <footer class="bg-dark text-white text-center p-2">
        <p>&copy; 2026 Testimony Assistant</p>
    </footer>

    <!-- Bootstrap JS local -->
    <script src="{% static 'testimony/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
