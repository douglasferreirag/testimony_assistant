<!-- Main content -->
{% load static %}

<main class="container mt-5">
    <h2 class="mb-4">Listagem de Conversas</h2>

    <!-- Conversation table -->
    <div class="table-responsive">
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Id da pessoa</th>
                    <th>Id do território</th>
                    <th>Data</th>
                </tr>
            </thead>

            <tbody>
                {% for conversation in conversations %}
                <tr>
                    <td>{{ conversation.id }}</td>
                    <td>{{ conversation.person }}</td>
                    <td>{{ conversation.territory }}</td>
                    <td>{{ conversation.conversation_date }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center">Nenhuma conversa cadastrada.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</main>
