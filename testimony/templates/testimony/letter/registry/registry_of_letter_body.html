<!-- Main content -->
{% load static %}

<main class="container mt-5">
    <h2 class="mb-4">Cadastro de Carta</h2>

    <!-- Notifications -->
    {% if messages %}
        {% for message in messages %}

            {% if 'letter' in message.tags %}

                <div class="alert alert-{{ message.level_tag }} alert-dismissible fade show" role="alert">

                    {{ message }}

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Fechar">
                    </button>

                </div>

            {% endif %}

        {% endfor %}
    {% endif %}

    <form id="letter-form" method="POST">
        {% csrf_token %}

        <div class="row mb-3">
            <div class="col-md-6">
                <label for="id" class="form-label">ID</label>
                <input
                    type="text"
                    class="form-control"
                    id="id"
                    name="id"
                    placeholder="Digite o ID"
                    required
                >
            </div>

            <div class="col-md-6">
                <label for="description" class="form-label">Descrição</label>
                <input
                    type="text"
                    class="form-control"
                    id="description"
                    name="description"
                    placeholder="Digite a descrição"
                    required
                >
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label for="base" class="form-label">Base</label>
                <input
                    type="text"
                    class="form-control"
                    id="base"
                    name="base"
                    placeholder="Digite a base"
                    required
                >
            </div>
        </div>

    </form>
</main>
