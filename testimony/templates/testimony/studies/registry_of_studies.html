{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Estudo</title>
    <!-- Bootstrap CSS local -->
    <link rel="stylesheet" href="{% static 'testimony/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'testimony/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'testimony/css/registry_of_studies.css' %}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Testimony Assistant</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                    data-bs-target="#navbarNav" aria-controls="navbarNav" 
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Itens do menu -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'registry_of_studies' %}">Cadastrar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Limpar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/">Página Inicial</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo principal -->
    <main class="container mt-5">
        <h2 class="mb-4">Cadastro de Estudo</h2>
        
        <form method="post">
            {% csrf_token %}
            <div class="row mb-3">
                <div class="col-md-4">
                    <label for="conversa_id" class="form-label">ID da Conversa</label>
                    <select class="form-select" id="conversa_id" name="conversa_id" required>
                        <option value="" selected disabled>Selecione a conversa</option>
                        <!-- opções de conversas virão do backend -->
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="publicacao_id" class="form-label">ID da Publicação</label>
                    <select class="form-select" id="publicacao_id" name="publicacao_id" required>
                        <option value="" selected disabled>Selecione a publicação</option>
                        <!-- opções de publicações virão do backend -->
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="ondecontinuar" class="form-label">Onde Continuar</label>
                    <input type="text" class="form-control" id="ondecontinuar" name="ondecontinuar" placeholder="Digite onde continuar" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Salvar</button>
        </form>
    </main>

    <!-- Rodapé -->
    <footer class="bg-dark text-white text-center p-2">
        <p>&copy; 2026 Testimony Assistant</p>
    </footer>

    <!-- Bootstrap JS local -->
    <script src="{% static 'testimony/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
