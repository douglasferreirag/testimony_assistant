<!-- Header -->

{% load static %}

<!-- Bootstrap CSS local -->
<link rel="stylesheet" href="{% static 'testimony/css/bootstrap.min.css' %}">
<link rel="stylesheet" href="{% static 'testimony/css/style.css' %}">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <!-- Brand -->
        <a class="navbar-brand" href="{% url 'homepage' %}">
            Testimony Assistant
        </a>

        <!-- Mobile menu button -->
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbar-menu"
            aria-controls="navbar-menu"
            aria-expanded="false"
            aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navigation items -->
        <div class="collapse navbar-collapse" id="navbar-menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                                href="#"
                                onclick="document.getElementById('person-form').submit(); return false;">
                                
                        Cadastrar
                    </a>
                </li>

                <li class="nav-item">
                    <a  
                                class="nav-link" 
                                href="#" 
                                onclick="document.getElementById('person-form').reset(); return false;">
                               
                        Limpar
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'homepage' %}">
                        Página Inicial
                    </a>
                </li>

            </ul>

        </div>
    </div>
</nav>
