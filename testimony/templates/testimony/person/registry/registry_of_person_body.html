<main class="container mt-5">
    <h2 class="mb-4">Cadastro de Pessoa</h2>

    <!-- Person messages -->
    {% if messages %}
        {% for message in messages %}
            {% if 'person' in message.tags %}
                <div class="alert alert-{{ message.level_tag }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endif %}
        {% endfor %}
    {% endif %}

    <form id="person-form" method="POST">
        {% csrf_token %}

        <div class="row mb-3">
            <div class="col-md-6">
                <label for="name" class="form-label">Nome</label>
                <input
                    type="text"
                    class="form-control"
                    id="name"
                    name="name"
                    placeholder="Digite o nome da pessoa"
                    required
                >
            </div>

            <div class="col-md-6">
                <label for="contact" class="form-label">Contato</label>
                <input
                    type="text"
                    class="form-control"
                    id="contact"
                    name="contact"
                    placeholder="Digite telefone ou e-mail"
                    required
                >
            </div>
        </div>

        
    </form>
</main>
