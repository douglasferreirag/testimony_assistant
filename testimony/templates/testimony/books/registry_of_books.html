{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Livro</title>
    <link rel="stylesheet" href="{% static 'testimony/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'testimony/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'testimony/css/registry_of_books.css' %}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Testimony Assistant</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                    data-bs-target="#navbarNav" aria-controls="navbarNav" 
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Itens do menu -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'registry_of_books' %}">Cadastrar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Limpar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/">Página Inicial</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo principal -->
    <main class="container mt-5">
        <h2 class="mb-4">Cadastro de Livro</h2>
        
        <form method="post">
            {% csrf_token %}
            <div class="row mb-3">
                <div class="col-md-3">
                    <label for="id" class="form-label">ID</label>
                    <input type="text" class="form-control" id="id" name="id" placeholder="Digite o ID" required>
                </div>
                <div class="col-md-3">
                    <label for="descricao" class="form-label">Descrição</label>
                    <input type="text" class="form-control" id="descricao" name="descricao" placeholder="Digite a descrição" required>
                </div>
                <div class="col-md-3">
                    <label for="ano" class="form-label">Ano</label>
                    <input type="number" class="form-control" id="ano" name="ano" min="1900" max="2100" required>
                </div>
                <div class="col-md-3">
                    <label for="capitulos" class="form-label">Quantidade de Capítulos</label>
                    <input type="number" class="form-control" id="capitulos" name="capitulos" min="1" required>
                </div>
            </div>

          
        </form>
    </main>

    <!-- Rodapé -->
    <footer class="bg-dark text-white text-center p-2">
        <p>&copy; 2026 Testimony Assistant</p>
    </footer>

    <script src="{% static 'testimony/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
