{% load static %}    
    <!-- Conteúdo principal -->
    <main class="container mt-5">
        <h2 class="mb-4">Listagem de Livros</h2>

        <!-- Tabela de livros -->
        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Descrição</th>
                        <th>Ano</th>
                        <th>Quantidade de Capítulos</th>
                    </tr>
                </thead>
                <tbody>
                    {% for livro in livros %}
                    <tr>
                        <td>{{ livro.id }}</td>
                        <td>{{ livro.descricao }}</td>
                        <td>{{ livro.ano }}</td>
                        <td>{{ livro.capitulos }}</td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4" class="text-center">Nenhum livro cadastrado.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </main>
