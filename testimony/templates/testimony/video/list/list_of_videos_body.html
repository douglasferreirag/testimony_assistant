<!-- Conteúdo principal -->

{% load static %}

<main class="container mt-5">
        <h2 class="mb-4">Listagem de Vídeos</h2>

        <!-- Tabela de vídeos -->
        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Descrição</th>
                        <th>Tempo</th>
                    </tr>
                </thead>
                <tbody>
                    {% for video in videos %}
                    <tr>
                        <td>{{ video.id }}</td>
                        <td>{{ video.descricao }}</td>
                        <td>{{ video.tempo }}</td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="text-center">Nenhum vídeo cadastrado.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
</main>
