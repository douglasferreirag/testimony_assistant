<!-- Conteúdo principal -->
{% load static %}

<main class="container mt-5">
        <h2 class="mb-4">Listagem de Cartas</h2>

        <!-- Tabela de cartas -->
        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Descrição</th>
                        <th>Base</th>
                    </tr>
                </thead>
                <tbody>
                    {% for carta in cartas %}
                    <tr>
                        <td>{{ carta.id_carta }}</td>
                        <td>{{ carta.descricao }}</td>
                        <td>{{ carta.base }}</td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="text-center">Nenhuma carta cadastrada.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
</main>
