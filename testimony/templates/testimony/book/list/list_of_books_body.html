{% load static %}

<!-- Main content -->
<main class="container mt-5">
    <h2 class="mb-4">Listagem de Livros</h2>

    <!-- Books table -->
    <div class="table-responsive">
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Descrição</th>
                    <th>Ano</th>
                    <th>Quantidade de Capítulos</th>
                </tr>
            </thead>

            <tbody>
                {% for book in books %}
                <tr>
                    <td>{{ book.id }}</td>
                    <td>{{ book.description }}</td>
                    <td>{{ book.year }}</td>
                    <td>{{ book.chapter_quantity }}</td>
                </tr>

                {% empty %}
                <tr>
                    <td colspan="4" class="text-center">
                        Nenhum livro cadastrado.
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</main>
