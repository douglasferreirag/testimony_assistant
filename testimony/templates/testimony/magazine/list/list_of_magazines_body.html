<!-- Conteúdo principal -->
{% load static %}

<main class="container mt-5">
        <h2 class="mb-4">Listagem de Revistas</h2>

        <!-- Tabela de revistas -->
        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Descrição</th>
                        <th>Ano</th>
                    </tr>
                </thead>
                <tbody>
                    {% for revista in revistas %}
                    <tr>
                        <td>{{ revista.id }}</td>
                        <td>{{ revista.descricao }}</td>
                        <td>{{ revista.ano }}</td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="text-center">Nenhuma revista cadastrada.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
</main>
